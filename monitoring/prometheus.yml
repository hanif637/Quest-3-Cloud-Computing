global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: smart-city-jember
    metrics_path: /metrics
    static_configs:
      - targets: ["flask:5000"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: windows-exporter
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9182"]
